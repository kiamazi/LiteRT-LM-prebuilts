name: Create Release

on:
  workflow_dispatch:
    inputs:
      litert_version:
        description: 'LiteRT version (e.g., v0.16.0)'
        required: true
        default: 'v0.16.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LiteRT-LM zip
        run: |
          wget https://github.com/google-ai-edge/LiteRT-LM/releases/download/${{ github.event.inputs.litert_version }}/litert_lm_c_api-0.1.0.zip
          unzip -q litert_lm_c_api-0.1.0.zip

      - name: Create release and upload files
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.litert_version }}
          files: |
            include/conversation.h
            include/engine.h
            lib/linux_arm64/liblitert-lm.so
            lib/linux_x86_64/liblitert-lm.so
            lib/android_arm64/liblitert-lm.so
            lib/android_x86_64/liblitert-lm.so
            lib/macos_arm64/liblitert-lm.dylib
            lib/windows_x86_64/litert-lm.dll
            lib/windows_x86_64/litert-lm.lib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}